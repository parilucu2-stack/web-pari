<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personally Pari - Name Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #120b1f;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(112, 26, 117, 0.3) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(76, 29, 149, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 20% 80%, rgba(88, 28, 135, 0.25) 0%, transparent 50%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Background Motif Halus */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(rgba(168, 85, 247, 0.1) 1px, transparent 1px);
            background-size: 24px 24px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            width: 100%;
            max-width: 500px;
            z-index: 2;
        }

        /* Tombol Kembali */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #c084fc;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 24px;
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .back-btn:hover {
            color: #e9d5ff;
            transform: translateX(-4px);
        }

        /* DESAIN KARTU NAMA */
        .profile-card {
            background: rgba(30, 19, 48, 0.7);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 20px;
            padding: 36px 32px;
            backdrop-filter: blur(12px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4), 0 0 30px rgba(147, 51, 234, 0.15);
            position: relative;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* CONTAINER FOTO PROFIL */
        .avatar-box {
            width: 65px;
            height: 65px;
            border: 2px solid #c084fc;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #2e1065;
            flex-shrink: 0;
        }

        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .header-title h1 {
            font-size: 22px;
            font-weight: 700;
            color: #f8fafc;
            letter-spacing: 0.5px;
        }

        .header-title p {
            font-size: 13px;
            color: #c084fc;
            margin-top: 2px;
        }

        /* DETAIL BIODATA */
        .info-group {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .info-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            font-weight: 600;
        }

        .info-value {
            font-size: 16px;
            color: #f1f5f9;
            font-weight: 500;
        }

        .hobby-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 6px;
        }

        .tag {
            background: rgba(168, 85, 247, 0.15);
            border: 1px solid rgba(192, 132, 252, 0.3);
            color: #e9d5ff;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
        }

        footer {
            margin-top: 30px;
            text-align: center;
            font-size: 13px;
            color: #64748b;
            z-index: 2;
        }

        footer span {
            color: #cbd5e1;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Tombol Kembali -->
        <a href="halaman2.html" class="back-btn">&larr; Kembali ke Dashboard</a>

        <!-- Kartu Nama Profil -->
        <div class="profile-card">
            <div class="card-header">
                <div class="avatar-box">
                    <!-- Deteksi otomatis nama file profile.jpeg maupun profile.jpeg.jpeg -->
                    <img src="assets/profile.jpeg" alt="Foto Profil Pari" onerror="this.onerror=null; this.src='assets/profile.jpeg.jpeg';">
                </div>
                <div class="header-title">
                    <h1>NAME CARD</h1>
                    <p>Personal Profile Details</p>
                </div>
            </div>

            <div class="info-group">
                <!-- NAMA -->
                <div class="info-item">
                    <span class="info-label">Nama Lengkap</span>
                    <span class="info-value">Fakhrii Rizq Ananda</span>
                </div>

                <!-- UMUR -->
                <div class="info-item">
                    <span class="info-label">Umur</span>
                    <span class="info-value">17 Tahun</span>
                </div>

                <!-- PEKERJAAN -->
                <div class="info-item">
                    <span class="info-label">Pekerjaan / Status</span>
                    <span class="info-value">Pelajar | Server Developer & Tech Enthusiast</span>
                </div>

                <!-- HOBI -->
                <div class="info-item">
                    <span class="info-label">Hobi & Minat</span>
                    <div class="hobby-tags">
                        <span class="tag">💻 Dev Server</span>
                        <span class="tag">🎮 Ngegame</span>
                        <span class="tag">📰 Cari Berita</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
    
    </footer>

</body>
</html>
